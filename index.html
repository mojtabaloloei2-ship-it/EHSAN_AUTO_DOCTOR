<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1830">
<title>EHSAN AUTO DOCTOR | مکانیک هوشمند احسان</title>
<style>
:root{--navy:#0b1830;--navy2:#142746;--teal:#16b8ad;--gold:#e5bd69;--paper:#f3f6fa;--ink:#172338;--muted:#65748a;--line:#dce4ed;--red:#c83232;--orange:#b86a08;--green:#147a59}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.8}
header{background:linear-gradient(135deg,var(--navy),#18385a);color:white;padding:22px 16px 26px;text-align:center;border-bottom:4px solid var(--teal)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px;color:white}.brand span{color:var(--gold)}header p{margin:4px 0 0;color:#d6e3ef;font-size:13px}
main{max-width:920px;margin:18px auto;padding:0 13px 40px}
.notice{background:#fff8e9;border:1px solid #f0d79e;border-radius:13px;padding:12px 14px;font-size:13px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{background:white;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 3px 12px #1723380b}
.action{width:100%;min-height:92px;border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink);padding:13px;text-align:right;font:inherit;cursor:pointer;display:flex;align-items:center;gap:12px}
.action:active,.btn:active{transform:scale(.99)}.ico{width:43px;height:43px;flex:0 0 43px;border-radius:12px;background:#e7f7f5;color:#087f79;display:grid;place-items:center;font-size:22px}
.action b{display:block;color:var(--navy);font-size:15px}.action small{display:block;color:var(--muted);font-size:11px}
h2{font-size:19px;color:var(--navy);margin:0 0 12px}h3{font-size:16px;color:var(--navy);margin:12px 0 7px}
.panel{display:none;margin-top:15px}.panel.active{display:block}
label{display:block;font-size:13px;font-weight:bold;margin:10px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd6e2;border-radius:10px;background:white;font:inherit;font-size:14px;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:10px;background:var(--teal);color:#062b2b;font:inherit;font-weight:bold;padding:11px 16px;cursor:pointer;margin:7px 3px 0 0}
.btn.secondary{background:#e8edf4;color:var(--navy)}.btn.dark{background:var(--navy);color:white}.btn.red{background:#ffe7e7;color:#8e2020}
.result{margin-top:12px;padding:13px;border-radius:12px;background:#eef4fb;border:1px solid #d7e2ef;white-space:normal}
.result.safe{background:#e9f7f0;border-color:#b7e2cb}.result.warn{background:#fff5e6;border-color:#f2d29e}.result.danger{background:#fff0f0;border-color:#efbcbc}
.muted{color:var(--muted);font-size:12px}.pill{display:inline-block;border-radius:30px;padding:2px 9px;background:#e9eef5;font-size:11px;margin:2px}
.step{background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:10px}
.progress{height:7px;background:#e2e9f0;border-radius:9px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:var(--teal);width:0}
footer{text-align:center;color:var(--muted);font-size:11px;padding:18px}
.hidden{display:none!important}
@media(max-width:560px){.grid{grid-template-columns:1fr}.action{min-height:78px}header{padding-top:18px}}
       
    
  // ===== EHSAN SMART OBD2 - CLEAN VERSION =====
  (function () {
    "use strict";

    const main = document.querySelector("main");
    const grid = document.querySelector(".grid");

    if (!main || document.getElementById("obd")) return;

    const obdCodes = [
      ["P0100", "مدار سنسور جریان هوای ورودی MAF", "بررسی سنسور، سوکت و سیم‌کشی", "متوسط"],
      ["P0101", "عملکرد نامناسب سنسور MAF", "بررسی فیلتر هوا و مسیر ورودی هوا", "متوسط"],
      ["P0115", "مدار سنسور دمای آب موتور", "بررسی سوکت و سیم‌کشی سنسور", "زیاد"],
      ["P0118", "سیگنال بالای سنسور دمای آب", "بررسی اتصالات و سنسور دما", "زیاد"],
      ["P0300", "احتراق ناقص تصادفی موتور", "بررسی شمع، کوئل، انژکتور و سوخت", "زیاد"],
      ["P0420", "بازده پایین کاتالیزور", "بررسی کاتالیزور و سنسور اکسیژن", "متوسط"],
      ["P0562", "ولتاژ پایین سیستم خودرو", "بررسی باتری، دینام و اتصالات", "زیاد"],
      ["P0700", "خطای سیستم کنترل گیربکس", "بررسی دیاگ اختصاصی گیربکس", "زیاد"]
    ];

    const card = document.createElement("button");
    card.type = "button";
    card.className = "service-card";
    card.textContent = "🔌 دیاگ هوشمند احسان";

    if (grid) grid.appendChild(card);
    else main.appendChild(card);

    const panel = document.createElement("section");
    panel.id = "obd";
    panel.className = "panel card";
    panel.style.display = "none";

    panel.innerHTML = `
      <h2>🔌 دیاگ هوشمند احسان</h2>
      <p>کد خطای خودرو را وارد کنید.</p>
      <input id="obdInput" maxlength="5" placeholder="مثلاً P0100"
        style="width:100%;padding:13px;border-radius:10px;">
      <button type="button" id="obdSearch">🔍 بررسی کد خطا</button>
      <div id="obdResult" class="notice" style="margin-top:15px">
        آماده بررسی کد خطا
      </div>
      <hr>
      <h3>🧪 شبیه‌ساز دیاگ</h3>
      <select id="obdDemo" style="width:100%;padding:12px">
        <option value="">انتخاب خطای آزمایشی</option>
        <option value="P0300">P0300 - احتراق ناقص</option>
        <option value="P0420">P0420 - کاتالیزور</option>
        <option value="P0562">P0562 - ولتاژ پایین</option>
        <option value="P0700">P0700 - گیربکس</option>
      </select>
      <button type="button" id="obdTest">اجرای شبیه‌سازی</button>
      <div id="obdDemoResult" class="notice"></div>
      <hr>
      <h3>📚 بانک کدهای خطا</h3>
      <input id="obdFilter" type="search"
        placeholder="جستجو در بانک کدها..."
        style="width:100%;padding:12px">
      <div id="obdList"></div>
      <hr>
      <h3>📚 سوابق عیب‌یابی احسان</h3>
      <div id="obdHistory"></div>
      <button type="button" id="obdClear">🗑️ پاک کردن سوابق</button>
      <div class="notice">
        ⚠️ این نسخه شبیه‌ساز نرم‌افزاری است و به ECU متصل نیست.
      </div>
      <div class="notice">
        هشدار ایمنی: در صورت اختلال ترمز، افت فشار روغن یا داغ‌شدن موتور،
        رانندگی را متوقف کنید.
      </div>
    `;

    const mechanics = document.getElementById("mechanics");
    if (mechanics) mechanics.insertAdjacentElement("afterend", panel);
    else main.appendChild(panel);

    card.addEventListener("click", function () {
      document.querySelectorAll(".panel").forEach(function (p) {
        p.style.display = "none";
      });
      panel.style.display = "block";
      panel.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    const input = panel.querySelector("#obdInput");
    const result = panel.querySelector("#obdResult");
    const list = panel.querySelector("#obdList");
    const filter = panel.querySelector("#obdFilter");
    const historyBox = panel.querySelector("#obdHistory");
    const historyKey = "ehsan_obd_history_v1";

    function showCode(code, target) {
      const item = obdCodes.find(x => x[0] === code);
      if (!item) {
        target.textContent = "این کد در بانک فعلی ثبت نشده است.";
        return;
      }

      target.textContent =
        item[0] + " — " + item[1] +
        " | روش بررسی: " + item[2] +
        " | شدت اولیه: " + item[3] +
        " | تشخیص قطعی نیازمند بررسی خودرو است.";

      saveHistory(item);
    }

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(historyKey) || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveHistory(item) {
      try {
        const records = getHistory();
        records.unshift({
          code: item[0],
          name: item[1],
          date: new Date().toLocaleString("fa-IR")
        });
        localStorage.setItem(historyKey, JSON.stringify(records.slice(0, 50)));
        renderHistory();
      } catch (e) {
        console.warn("History save failed", e);
      }
    }

    function renderHistory() {
      const records = getHistory();
      historyBox.innerHTML = "";

      if (!records.length) {
        historyBox.textContent = "هنوز سابقه‌ای ثبت نشده است.";
        return;
      }

      records.forEach(function (record) {
        const row = document.createElement("p");
        row.textContent = record.code + " — " + record.name + " | " + record.date;
        historyBox.appendChild(row);
      });
    }

    function renderList() {
      const term = filter.value.trim().toUpperCase();
      list.innerHTML = "";

      obdCodes.filter(x => x.join(" ").toUpperCase().includes(term))
        .forEach(function (item) {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "btn";
          row.style.margin = "5px";
          row.textContent = item[0] + " — " + item[1];
          row.addEventListener("click", function () {
            input.value = item[0];
            showCode(item[0], result);
          });
          list.appendChild(row);
        });
    }

    panel.querySelector("#obdSearch").addEventListener("click", function () {
      const code = input.value.trim().toUpperCase();
      if (!/^P[0-9A-F]{4}$/.test(code)) {
        result.textContent = "لطفاً کد معتبر مانند P0100 وارد کنید.";
        return;
      }
      showCode(code, result);
    });

    panel.querySelector("#obdTest").addEventListener("click", function () {
      const code = panel.querySelector("#obdDemo").value;
      const demo = panel.querySelector("#obdDemoResult");
      if (!code) {
        demo.textContent = "ابتدا یک خطای آزمایشی انتخاب کنید.";
        return;
      }
      showCode(code, demo);
    });

    filter.addEventListener("input", renderList);

    panel.querySelector("#obdClear").addEventListener("click", function () {
      if (!confirm("سوابق عیب‌یابی پاک شوند؟")) return;
      localStorage.removeItem(historyKey);
      renderHistory();
    });

    renderList();
    renderHistory();

    console.log("EHSAN SMART OBD2 READY");
  })();
  // ===== END EHSAN SMART OBD2 =====  
</script>
</body>
     </html>
