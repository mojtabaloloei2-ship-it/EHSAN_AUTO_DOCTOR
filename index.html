
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071d2b">
<title>EHSAN AUTO DOCTOR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071d2b;color:#fff;font-family:Tahoma,Arial,sans-serif}
header{text-align:center;padding:28px 15px;background:linear-gradient(140deg,#073c50,#087e8b)}
.logo{font-size:38px;font-weight:bold;color:#fff}
header h1{font-size:23px;margin:12px 0}
header p{color:#d6f5f3;font-size:13px}
main{max-width:650px;margin:auto;padding:16px}
.card{background:#102d3c;border:1px solid #244958;border-radius:15px;padding:17px;margin:14px 0}
h2{font-size:17px;color:#50d6cf;margin-top:0}
label{display:block;margin:12px 0 7px;font-size:13px}
select,textarea,input{width:100%;padding:13px;border-radius:9px;border:1px solid #426477;background:#fff;color:#142a35;font-family:inherit;font-size:14px}
textarea{height:105px;resize:vertical}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#08a6a5;color:white;font-family:inherit;font-size:15px;font-weight:bold;margin-top:13px}
button:active{opacity:.8}
.result{display:none;white-space:pre-line;line-height:2;font-size:14px}
.warning{color:#ffb2a9}
.safe{color:#7ee6a2}
footer{text-align:center;color:#9bb6c1;font-size:11px;padding:25px}
</style>
</head>
<body>
<header>
<div class="logo">EHSAN</div>
<h1>مکانیک هوشمند احسان</h1>
<p>دستیار هوشمند عیب‌یابی و تعمیر خودرو</p>
</header>

<main>
<section class="card">
<h2>🔧 عیب‌یابی خودرو</h2>
<label>۱. نوع خودرو را انتخاب کنید</label>
<select id="car">
<option value="">انتخاب خودرو</option>
<option>پراید</option>
<option>پژو 405</option>
<option>پژو پارس</option>
<option>پژو 206</option>
<option>سمند</option>
<option>دنا</option>
<option>تیبا</option>
<option>ساینا</option>
<option>کوییک</option>
<option>شاهین</option>
<option>رانا</option>
<option>تارا</option>
<option>سایر خودروها</option>
</select>

<label>۲. نوع مشکل</label>
<select id="problem">
<option value="">انتخاب مشکل</option>
<option value="start">روشن نشدن خودرو</option>
<option value="engine">لرزش یا بد کار کردن موتور</option>
<option value="heat">بالا رفتن آمپر آب</option>
<option value="oil">چراغ روغن روشن شده</option>
<option value="brake">مشکل ترمز</option>
<option value="gear">مشکل گیربکس</option>
<option value="battery">مشکل باتری و برق</option>
<option value="smoke">دود غیرعادی اگزوز</option>
<option value="other">سایر مشکلات</option>
</select>

<label>۳. توضیح بیشتر درباره خرابی</label>
<textarea id="details" placeholder="مثلاً خودرو استارت می‌خورد ولی روشن نمی‌شود..."></textarea>

<button onclick="diagnose()">شروع عیب‌یابی</button>
</section>

<section class="card">
<h2>🚨 امداد فوری احسان</h2>
<p style="font-size:13px;line-height:2">
در صورت خرابی خودرو، ابتدا محل امنی پیدا کنید.
در مشکلات خطرناک، ادامه رانندگی ممنوع است.
</p>
<button onclick="emergency()">بررسی وضعیت اضطراری</button>
<div id="emergencyResult" class="result"></div>
</section>

<section class="card">
<h2>📋 نتیجه عیب‌یابی</h2>
<div id="result" class="result"></div>
</section>
</main>

<footer>
EHSAN AUTO DOCTOR<br>
نسخه اولیه سامانه مکانیک هوشمند احسان
</footer>

<script>
function diagnose(){
const car=document.getElementById('car').value;
const problem=document.getElementById('problem').value;
const details=document.getElementById('details').value;
const out=document.getElementById('result');

if(!car || !problem){
alert('لطفاً خودرو و نوع مشکل را انتخاب کنید.');
return;
}

let answer={
start:'علل احتمالی: باتری ضعیف، خرابی استارت، رله استارت یا سیستم سوخت‌رسانی.\nبررسی اولیه: چراغ‌های پشت آمپر و صدای استارت را بررسی کنید.',
engine:'علل احتمالی: شمع، کوئل، انژکتور، نشتی هوا یا سنسورهای موتور.\nبررسی اولیه: صدای موتور و چراغ چک را بررسی کنید.',
heat:'علل احتمالی: کمبود مایع خنک‌کننده، خرابی فن، ترموستات یا واترپمپ.\nهشدار: خودرو را متوقف کنید و اجازه دهید موتور خنک شود. درِ رادیاتور داغ را باز نکنید.',
oil:'هشدار بسیار مهم: چراغ قرمز روغن می‌تواند نشانه افت فشار روغن باشد.\nفوراً موتور را خاموش کنید. تا بررسی سطح روغن و علت افت فشار، رانندگی نکنید.',
brake:'هشدار ایمنی: خرابی ترمز بسیار خطرناک است.\nدر محل امن توقف کنید. اگر ترمز ضعیف شده یا نشتی وجود دارد، خودرو را رانندگی نکنید و از امداد استفاده کنید.',
gear:'علل احتمالی: کمبود یا خرابی روغن گیربکس، ایراد برقی یا خرابی قطعات داخلی.\nاز گاز دادن شدید و ادامه رانندگی در صورت ضربه یا لغزش شدید خودداری کنید.',
battery:'علل احتمالی: باتری ضعیف، دینام، اتصالات یا سیم‌کشی.\nاتصالات باتری را فقط در حالت خاموش و با رعایت ایمنی بررسی کنید.',
smoke:'دود آبی می‌تواند با روغن‌سوزی، دود سفید با بخار یا ورود مایع خنک‌کننده و دود سیاه با احتراق ناقص مرتبط باشد.\nرنگ و مقدار دود و وضعیت آمپر آب را بررسی کنید.',
other:'برای تشخیص دقیق‌تر به شرح علائم، صداها، چراغ‌های هشدار و شرایط وقوع خرابی نیاز داریم.'
};

out.style.display='block';
out.innerHTML='<b>خودرو: '+car+'</b>\n\n'+answer[problem]+'\n\nشرح شما: '+(details || 'توضیحی ثبت نشده است')+'\n\nتوجه: این نتیجه تشخیص قطعی نیست و باید با بررسی فنی تأیید شود.';
out.scrollIntoView({behavior:'smooth'});
}

function emergency(){
const p=document.getElementById('problem').value;
const out=document.getElementById('emergencyResult');
out.style.display='block';

if(p==='brake'||p==='oil'||p==='heat'){
out.innerHTML='<span class="warning">⛔ وضعیت خطرناک\n\nدر محل امن توقف کنید و موتور را در صورت لزوم خاموش کنید. رانندگی را ادامه ندهید. از امداد یا تعمیرکار کمک بگیرید.</span>';
}else{
out.innerHTML='<span class="safe">ابتدا خودرو را در محل امن متوقف کنید. وضعیت ظاهری و چراغ‌های هشدار را بررسی کنید. اگر نشانه خطر جدی وجود دارد، رانندگی نکنید.</span>';
}
}
</script>
</body>
</html>
